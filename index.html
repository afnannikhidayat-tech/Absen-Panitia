<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Absensi Panitia</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f5;font:15px Arial}
main{max-width:800px;margin:auto;padding:15px}.card{background:white;padding:16px;margin:12px 0;border-radius:10px}
input,textarea,button{width:100%;padding:12px;margin:6px 0;font-size:16px}
textarea{height:130px}button{border:0;border-radius:8px;background:#08783e;color:white;font-weight:bold}
.red{background:#b42318}.gray{background:#34495e}table{width:100%;border-collapse:collapse}
th,td{padding:8px;border:1px solid #ddd}.scroll{overflow:auto}
#modeAbsen,#kamera{display:none;position:fixed;inset:0;z-index:20;background:#07552e;color:white}
#modeAbsen{padding:25px;text-align:center}#modeAbsen button{max-width:450px;margin:10px auto;display:block}
#hasil{background:white;color:#111;padding:20px;border-radius:10px;max-width:450px;margin:25px auto}
#kamera{z-index:30;background:#000}#reader{width:100%;height:100%}
</style>
</head>
<body>
<main id="input">
<h2>Absensi Panitia Sepak Bola</h2>
<div class="card">Data panitia, format <b>ID,Nama</b>
<textarea id="orang" placeholder="P001,Budi&#10;P002,Siti"></textarea>
<button onclick="simpanPanitia()">Simpan Panitia</button></div>
<div class="card">Tanggal mulai<input type="date" id="awal">
Tanggal selesai<input type="date" id="akhir">
<button onclick="simpanPeriode()">Simpan Periode</button></div>
<div class="card"><button onclick="bukaMode()">Mulai Absen</button>
<button class="gray" onclick="unduh()">Unduh CSV</button></div>
<div class="card scroll"><table><thead><tr><th>ID</th><th>Nama</th><th>Hadir</th><th>Tidak Hadir</th></tr></thead>
<tbody id="rekap"></tbody></table></div>
</main>

<div id="modeAbsen">
<h1>Absensi Panitia</h1>
<div id="hasil">Tekan tombol untuk memindai QR.</div>
<button onclick="bukaKamera()">Buka Kamera</button>
<button class="red" onclick="kembali()">Kembali ke Halaman Input</button>
</div>
<div id="kamera"><div id="reader"></div></div>

<script>
let P=JSON.parse(localStorage.P||"[]"),A=JSON.parse(localStorage.A||"{}"),
R=JSON.parse(localStorage.R||"{}"),Q=null,proses=false;
orang.value=P.map(x=>x.id+","+x.nama).join("\n");awal.value=R.awal||"";akhir.value=R.akhir||"";
const hari=()=>{let d=new Date(),z=n=>String(n).padStart(2,"0");return`${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`};
function simpanPanitia(){
 let m=new Map();orang.value.split("\n").forEach(b=>{let [id,...n]=b.split(",");if(id&&n.length)m.set(id.trim(),{id:id.trim(),nama:n.join(",").trim()})});
 P=[...m.values()];localStorage.P=JSON.stringify(P);tampil();alert("Data tersimpan.");
}
function simpanPeriode(){
 if(!awal.value||!akhir.value||awal.value>akhir.value)return alert("Periode tidak valid.");
 R={awal:awal.value,akhir:akhir.value};localStorage.R=JSON.stringify(R);tampil();
}
function total(){
 if(!R.awal||hari()<R.awal)return 0;let b=hari()<R.akhir?hari():R.akhir;
 return Math.floor((new Date(b)-new Date(R.awal))/86400000)+1;
}
async function bukaMode(){
 if(!P.length||!R.awal)return alert("Lengkapi data panitia dan periode.");
 if(hari()<R.awal||hari()>R.akhir)return alert("Di luar periode kompetisi.");
 modeAbsen.style.display="block";
 try{await modeAbsen.requestFullscreen()}catch(e){}
}
async function bukaKamera(){
 kamera.style.display="block";proses=false;Q=new Html5Qrcode("reader");
 try{await Q.start({facingMode:"environment"},{fps:10,qrbox:250},baca)}
 catch(e){kamera.style.display="none";alert("Kamera gagal dibuka.");}
}
async function baca(id){
 if(proses)return;proses=true;id=id.trim();let p=P.find(x=>x.id===id),k=hari()+"|"+id;
 if(!p)hasil.textContent="QR tidak terdaftar: "+id;
 else if(A[k])hasil.textContent=p.nama+" sudah absen hari ini.";
 else{A[k]=new Date().toLocaleTimeString("id-ID");localStorage.A=JSON.stringify(A);hasil.textContent="Berhasil: "+p.nama;tampil()}
 try{await Q.stop();await Q.clear()}catch(e){}Q=null;kamera.style.display="none";
}
async function kembali(){
 if(Q)try{await Q.stop()}catch(e){}modeAbsen.style.display=kamera.style.display="none";
 if(document.fullscreenElement)await document.exitFullscreen();
}
function tampil(){
 let t=total();rekap.innerHTML=P.map(p=>{let h=Object.keys(A).filter(k=>k.endsWith("|"+p.id)&&k.split("|")[0]>=R.awal&&k.split("|")[0]<=R.akhir).length;
 return`<tr><td>${p.id}</td><td>${p.nama}</td><td>${h}</td><td>${Math.max(0,t-h)}</td></tr>`}).join("");
}
function unduh(){let s="ID,Nama,Hadir,Tidak Hadir\n"+[...rekap.rows].map(r=>[...r.cells].map(c=>`"${c.innerText}"`).join(",")).join("\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+s]));a.download="rekap.csv";a.click()}
tampil();
</script>
</body>
</html>
